<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gestão Xpert IA — Distrito Rio Litoral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green-900:#062E1C;
    --green-800:#0A4A2E;
    --green-700:#0E6440;
    --green-600:#138257;
    --green-100:#E8F3EE;
    --green-50:#F4F9F6;
    --bg:#FFFFFF;
    --surface:#FAFBFA;
    --border:#E5E9E6;
    --border-strong:#D2D9D4;
    --text:#0A1410;
    --text-muted:#5B6661;
    --text-soft:#8A938E;
    --accent:#138257;
    --shadow-sm:0 1px 2px rgba(6,46,28,.04);
    --shadow-md:0 4px 16px rgba(6,46,28,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}

  /* ===== HEADER ===== */
  header.app{
    background:var(--green-900);
    color:#fff;
    padding:18px 32px;
    display:flex;align-items:center;justify-content:space-between;gap:24px;
    border-bottom:1px solid var(--green-800);
  }
  .brand{display:flex;align-items:center;gap:14px}
  .brand-mark{
    width:36px;height:36px;border-radius:8px;
    background:linear-gradient(135deg,var(--green-600),var(--green-700));
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#fff;font-size:15px;letter-spacing:-.5px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);
  }
  .brand-text h1{font-size:15px;font-weight:700;letter-spacing:-.2px;line-height:1.2}
  .brand-text p{font-size:11px;color:#8FB8A3;font-weight:500;text-transform:uppercase;letter-spacing:1.2px;margin-top:2px}
  .header-meta{display:flex;align-items:center;gap:28px}
  .meta-item{display:flex;flex-direction:column;align-items:flex-end}
  .meta-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#8FB8A3;font-weight:600}
  .meta-value{font-size:13px;font-weight:700;color:#fff;font-family:'JetBrains Mono',monospace;margin-top:2px}

  /* ===== TABS BAR ===== */
  .tabs-wrap{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;box-shadow:var(--shadow-sm)}
  .tabs{
    display:flex;align-items:stretch;
    max-width:1400px;margin:0 auto;
    overflow-x:auto;scrollbar-width:thin;
    padding:0 16px;
  }
  .tab-group{display:flex;align-items:stretch;position:relative}
  .tab-group:not(:last-child)::after{
    content:"";position:absolute;right:-1px;top:14px;bottom:14px;
    width:1px;background:var(--border-strong);
  }
  .tab{
    background:transparent;border:0;cursor:pointer;
    padding:14px 14px 12px;
    display:flex;align-items:center;gap:10px;
    border-bottom:2px solid transparent;
    transition:all .18s ease;
    font-family:inherit;font-size:13px;
    color:var(--text-muted);
    white-space:nowrap;
    position:relative;
  }
  .tab:hover{color:var(--green-800);background:var(--green-50)}
  .tab.active{color:var(--green-900);border-bottom-color:var(--green-700);font-weight:700;background:#fff}
  .tab .avatar{
    width:24px;height:24px;border-radius:50%;
    background:var(--green-100);color:var(--green-800);
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;letter-spacing:-.3px;
    flex-shrink:0;
  }
  .tab.active .avatar{background:var(--green-700);color:#fff}
  .tab-name{display:flex;flex-direction:column;text-align:left;line-height:1.1}
  .tab-name b{font-weight:600;font-size:13px}
  .tab-name span{font-size:10px;color:var(--text-soft);font-weight:500;margin-top:1px}
  .tab.active .tab-name span{color:var(--green-600)}

  /* ===== MAIN ===== */
  main{
    flex:1;
    max-width:1400px;margin:0 auto;width:100%;
    padding:36px 32px 80px;
  }
  .panel{display:none}
  .panel.active{display:block;animation:fadeIn .25s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ===== PANEL HEADER ===== */
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;gap:24px;
    margin-bottom:28px;
  }
  .person{display:flex;align-items:center;gap:18px}
  .person-avatar{
    width:60px;height:60px;border-radius:14px;
    background:linear-gradient(135deg,var(--green-700),var(--green-900));
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:20px;letter-spacing:-.5px;
    box-shadow:var(--shadow-md);
  }
  .person h2{font-size:24px;font-weight:800;letter-spacing:-.8px;line-height:1.1}
  .person-meta{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12px;color:var(--text-muted)}
  .person-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--text-soft)}
  .badge-polo{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--green-100);color:var(--green-800);
    padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.2px;
  }
  .badge-polo::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--green-700)}

  /* ===== SECTION ===== */
  .section{margin-bottom:36px}
  .section-head{
    display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    padding-bottom:10px;margin-bottom:18px;
    border-bottom:1px solid var(--border);
  }
  .section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--green-800)}
  .section-sub{font-size:11px;color:var(--text-soft);font-weight:500}

  /* ===== KPI CARDS ===== */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:22px}
  .kpi{
    background:#fff;border:1px solid var(--border);border-radius:12px;
    padding:18px 20px;
    transition:border-color .15s,box-shadow .15s;
  }
  .kpi:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
  .kpi.featured{
    background:linear-gradient(135deg,var(--green-900) 0%,var(--green-800) 100%);
    color:#fff;border-color:var(--green-900);
  }
  .kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;font-weight:700;color:var(--text-muted)}
  .kpi.featured .kpi-label{color:#8FB8A3}
  .kpi-value{
    font-family:'JetBrains Mono',monospace;
    font-size:38px;font-weight:700;letter-spacing:-1.2px;line-height:1;
    margin-top:10px;color:var(--text);
  }
  .kpi.featured .kpi-value{color:#fff}
  .kpi-foot{font-size:11px;color:var(--text-muted);margin-top:8px;font-weight:500}
  .kpi.featured .kpi-foot{color:#A8C8B6}

  /* ===== TABLE ===== */
  .table-card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead th{
    background:var(--green-50);
    text-align:left;
    font-size:10px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;
    color:var(--green-800);
    padding:11px 18px;
    border-bottom:1px solid var(--border);
  }
  tbody td{padding:12px 18px;font-size:13px;border-bottom:1px solid var(--border)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--green-50)}
  td.date{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-muted);width:120px}
  td.client{font-weight:600;color:var(--text)}
  td.num{font-family:'JetBrains Mono',monospace;text-align:right;width:50px;color:var(--text-soft);font-size:11px}
  td.dias{text-align:right;width:90px}
  td.tpv{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;text-align:right;color:var(--green-800);white-space:nowrap}
  .pill-mes{
    display:inline-block;padding:2px 9px;border-radius:999px;
    font-size:10px;font-weight:700;letter-spacing:.3px;
    background:var(--green-50);color:var(--green-800);
    border:1px solid var(--green-100);
  }
  .pill-dias{
    display:inline-block;padding:2px 8px;border-radius:6px;
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
  }
  .pill-dias.ok    {background:#E8F3EE;color:#0E6440}
  .pill-dias.warn  {background:#FFF4E5;color:#9A5A00}
  .pill-dias.alert {background:#FDECEC;color:#A0231A}

  .kpi.compact{padding:14px 16px}
  .kpi.compact .kpi-value{font-size:26px;margin-top:6px}
  .kpi.compact .kpi-label{font-size:9px}
  .kpi.outline{background:var(--green-50);border-color:var(--green-100)}

  /* Interactive cells */
  .yesno{display:inline-flex;gap:4px;background:var(--surface);padding:3px;border-radius:8px;border:1px solid var(--border)}
  .yesno button{
    border:0;background:transparent;cursor:pointer;
    padding:5px 12px;border-radius:6px;
    font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.3px;
    color:var(--text-soft);
    transition:all .15s ease;
  }
  .yesno button:hover{color:var(--text)}
  .yesno button.sim.active{background:var(--green-700);color:#fff;box-shadow:0 1px 2px rgba(6,46,28,.18)}
  .yesno button.nao.active{background:#A0231A;color:#fff;box-shadow:0 1px 2px rgba(160,35,26,.2)}
  .date-input{
    font-family:'JetBrains Mono',monospace;font-size:12px;
    padding:6px 8px;border:1px solid var(--border);border-radius:6px;
    background:#fff;color:var(--text);
    width:140px;
    transition:border-color .15s;
  }
  .date-input:hover:not(:disabled){border-color:var(--border-strong)}
  .date-input:focus{outline:none;border-color:var(--green-700);box-shadow:0 0 0 3px var(--green-50)}
  .date-input:disabled{background:var(--surface);color:var(--text-soft);cursor:not-allowed;opacity:.5}

  tr.row-sim{background:linear-gradient(90deg,rgba(19,130,87,.04),transparent)}
  tr.row-nao{background:linear-gradient(90deg,rgba(160,35,26,.04),transparent)}
  tr.row-sim td.client{color:var(--green-800)}
  tr.row-nao td.client{color:var(--text-muted);text-decoration:line-through;text-decoration-color:var(--text-soft)}

  /* Progress chip in section header */
  .progress-chip{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--green-50);border:1px solid var(--green-100);
    padding:3px 10px;border-radius:999px;
    font-size:11px;font-weight:600;color:var(--green-800);
  }
  .progress-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--green-700)}
  .reset-link{
    background:transparent;border:0;color:var(--text-soft);cursor:pointer;
    font-family:inherit;font-size:10px;text-decoration:underline;padding:3px 6px;
    margin-left:6px;
  }
  .reset-link:hover{color:var(--green-800)}

  /* ===== OPERAÇÃO TAB ===== */
  /* ===== Resumo Operacional (individual) ===== */
  .resumo-section{
    background:linear-gradient(180deg,var(--green-50) 0%,#fff 100%);
    border:1px solid var(--green-100);
    border-radius:14px;
    padding:22px 24px;
    margin-bottom:36px;
  }
  .resumo-section .section-head{border:0;padding:0;margin-bottom:14px}
  .resumo-section .kpi-grid{grid-template-columns:repeat(4,1fr);margin-bottom:0}
  .resumo-section .kpi{
    background:#fff;border:1px solid var(--border);
    padding:14px 16px;
  }
  .resumo-section .kpi-value{font-size:30px}
  .resumo-section .kpi-label{font-size:9px}
  @media (max-width:900px){
    .resumo-section .kpi-grid{grid-template-columns:repeat(2,1fr)}
  }

  /* ===== Barra de migração ===== */
  .migration-cell{
    display:flex;align-items:center;gap:8px;
    min-width:130px;
  }
  .migration-bar{
    flex:1;height:7px;
    background:#EEF1EE;border-radius:4px;overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.02);
  }
  .migration-fill{
    height:100%;border-radius:4px;
    transition:width .3s ease, background-color .3s ease;
  }
  .migration-pct{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;font-weight:700;
    text-align:right;min-width:48px;
  }
  td .migration-cell{min-width:120px}

  /* Migração inline no kpi-foot */
  .kpi .migration-cell{margin-top:2px}

  /* ===== Dropdown de motivo de churn ===== */
  .motivo-select{
    font-family:inherit;font-size:12px;
    padding:6px 28px 6px 10px;
    border:1px solid var(--border);border-radius:6px;
    background:#fff;color:var(--text);
    min-width:200px;cursor:pointer;
    appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%235B6661' d='M5 6L0 0h10z'/></svg>");
    background-repeat:no-repeat;background-position:right 10px center;background-size:8px;
    transition:border-color .15s, box-shadow .15s;
  }
  .motivo-select:hover{border-color:var(--border-strong)}
  .motivo-select:focus{outline:none;border-color:var(--green-700);box-shadow:0 0 0 3px var(--green-50)}
  .motivo-select.filled{
    background-color:var(--green-50);border-color:var(--green-100);
    color:var(--green-800);font-weight:600;
  }
  td.motivo{min-width:220px}
  td.receita-churn{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;text-align:right;color:#9A2F25;white-space:nowrap}
  td.rota-cell{font-size:12px;color:var(--text);text-transform:uppercase;letter-spacing:.3px;font-weight:600;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
  td.afiliacoes-cell{min-width:150px;padding:8px 12px}
  td.seg-cell{font-size:11.5px;color:var(--text);max-width:180px;line-height:1.3}
  .princ-badge{
    display:inline-block;padding:3px 9px;border-radius:999px;
    font-size:10px;font-weight:700;letter-spacing:.3px;
    white-space:nowrap;
  }
  .princ-yes{background:#E8F3EE;color:#0E6440;border:1px solid #CDE5D8}
  .princ-no{background:#FDF5F4;color:#9A2F25;border:1px solid #F2D1CC}
  .princ-unk{background:#F4F5F4;color:#6B7280;border:1px solid #E5E9E6}

  /* ===== Tela de loading e erro de bootstrap ===== */
  #app-loading{
    position:fixed;inset:0;background:#fff;z-index:9999;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    font-family:'Manrope',system-ui,sans-serif;
  }
  .boot-spinner{
    width:42px;height:42px;border-radius:50%;
    border:3px solid var(--green-100);border-top-color:var(--green-700);
    animation:boot-spin .8s linear infinite;
    margin-bottom:18px;
  }
  @keyframes boot-spin{to{transform:rotate(360deg)}}
  #app-loading .lbl{font-size:13px;color:var(--text-muted);font-weight:600;letter-spacing:.3px}
  #app-loading .sub{font-size:11px;color:var(--text-soft);margin-top:4px}
  .boot-err{padding:60px 32px;text-align:center;max-width:480px;margin:0 auto}
  .boot-err .ico{
    display:inline-flex;width:52px;height:52px;border-radius:50%;
    background:#FDECEC;color:#A0231A;
    align-items:center;justify-content:center;font-size:26px;font-weight:700;
    margin-bottom:14px;
  }
  .boot-err h2{font-size:20px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px}
  .boot-err p{color:var(--text-muted);margin-bottom:18px;font-size:13px}
  .boot-err button{
    background:var(--green-700);color:#fff;border:0;border-radius:6px;
    padding:8px 18px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;
  }
  .boot-err button:hover{background:var(--green-800)}
  .stone-codes-wrap{display:flex;flex-wrap:wrap;gap:4px}
  .stone-code{
    display:inline-flex;align-items:center;gap:5px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;font-weight:600;letter-spacing:-.2px;
    color:var(--text);
    background:var(--surface);
    border:1px solid var(--border);
    padding:3px 8px;border-radius:5px;
    cursor:pointer;user-select:none;
    transition:all .15s ease;
    white-space:nowrap;
  }
  .stone-code:hover{
    border-color:var(--green-700);
    color:var(--green-800);
    background:var(--green-50);
  }
  .stone-code:hover .copy-ico{opacity:1}
  .stone-code .copy-ico{
    opacity:.35;font-size:10px;line-height:1;
    transition:opacity .15s ease;
  }
  .stone-code.copied{
    background:var(--green-700);color:#fff;border-color:var(--green-700);
  }
  .stone-code.copied .copy-ico{opacity:1}
  .collapse-btn{
    background:transparent;
    border:1px solid var(--border);
    border-radius:6px;
    padding:4px 9px;
    cursor:pointer;
    font-family:inherit;
    font-size:10px;
    font-weight:700;
    letter-spacing:.5px;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-left:10px;
    display:inline-flex;align-items:center;gap:5px;
    transition:all .15s ease;
    flex-shrink:0;
  }
  .collapse-btn:hover{color:var(--green-800);border-color:var(--green-700);background:var(--green-50)}
  .collapse-btn .chev{
    display:inline-block;
    font-size:9px;
    transition:transform .2s ease;
    line-height:1;
  }
  .section[data-collapsed="true"] .collapse-btn .chev{transform:rotate(-90deg)}
  .section[data-collapsed="true"] .table-card{display:none}
  .section[data-collapsed="true"] .empty{display:none}
  .section[data-collapsed="true"] .kpi-grid{margin-bottom:0}
  .section-head-right{display:flex;align-items:center;gap:8px;flex-shrink:0}

  .tab.op{
    background:var(--green-50);
    border-right:1px solid var(--border-strong);
    padding-left:18px;padding-right:18px;
  }
  .tab.op .avatar{background:var(--green-700);color:#fff}
  .tab.op.active{background:#fff}
  .op-head{
    background:linear-gradient(135deg,var(--green-900) 0%,var(--green-800) 60%,var(--green-700) 100%);
    color:#fff;
    border-radius:14px;
    padding:24px 28px;
    margin-bottom:32px;
    display:flex;align-items:center;justify-content:space-between;gap:24px;
    box-shadow:var(--shadow-md);
  }
  .op-head h2{font-size:24px;font-weight:800;letter-spacing:-.8px;line-height:1.1;color:#fff}
  .op-head .op-meta{font-size:12px;color:#8FB8A3;margin-top:6px;font-weight:500}
  .op-head .op-stats{display:flex;gap:28px}
  .op-stat{text-align:right}
  .op-stat .l{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:#8FB8A3;font-weight:700}
  .op-stat .v{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:#fff;margin-top:4px}
  .op-mark{
    width:54px;height:54px;border-radius:12px;
    background:rgba(255,255,255,.1);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px;letter-spacing:.5px;color:#fff;
    border:1px solid rgba(255,255,255,.18);
  }

  /* Ranking table cells */
  td.rank-spec{font-weight:700;color:var(--text)}
  td.rank-polo{color:var(--text-muted);font-size:12px}
  td.rank-num{font-family:'JetBrains Mono',monospace;font-weight:700;text-align:right;width:80px;color:var(--text)}
  .mini-pill{
    display:inline-block;padding:1px 7px;border-radius:999px;
    font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.3px;
  }
  .mini-pill.sim{background:#E8F3EE;color:#0E6440}
  .mini-pill.nao{background:#FDECEC;color:#A0231A}
  .mini-pill.pend{background:#F4F5F4;color:#6B7280}

  @media (max-width:760px){
    .op-head{flex-direction:column;align-items:flex-start;padding:18px}
    .op-head .op-stats{flex-wrap:wrap;gap:16px}
    .op-stat{text-align:left}
  }

  .empty{
    background:#fff;border:1px dashed var(--border-strong);border-radius:12px;
    padding:48px 24px;text-align:center;
  }
  .empty-icon{
    width:48px;height:48px;border-radius:50%;background:var(--green-50);color:var(--green-700);
    display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;
    font-size:22px;
  }
  .empty p{color:var(--text-muted);font-size:13px}
  .empty p b{color:var(--text);font-weight:700}

  /* ===== PLACEHOLDER ===== */
  .placeholder-section{

<script>
(async function bootGestaoXpert() {
  // ===== Bootstrap: busca payload.json hospedado junto do HTML =====
  let DATA;
  const loadingEl = document.getElementById('app-loading');
  try {
    const url = './payload.json?t=' + Date.now();   // cache-bust
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ao buscar payload.json');
    DATA = await res.json();
  } catch (err) {
    if (loadingEl) {
      loadingEl.innerHTML = `<div class="boot-err">
        <div class="ico">!</div>
        <h2>Erro ao carregar a carteira</h2>
        <p>${err.message}</p>
        <button onclick="location.reload()">Tentar novamente</button>
      </div>`;
    }
    return;
  }
  if (loadingEl) loadingEl.remove();


// Currency formatter (BRL, sem decimais)
const fmtBRL = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits:0 });

// ===== Barra de migração (escala discreta) =====
// 0–49%   → vermelho
// 50–99%  → laranja
// 100%+   → verde
function migrationColor(pct){
  if (pct < 50)        return '#DC2626';   // red-600
  if (pct < 100)       return '#F59E0B';   // amber-500
  return '#16A34A';                         // green-600
}
function migrationBar(pct){
  const display  = isFinite(pct) ? Math.round(pct) : 0;
  const fill     = Math.min(Math.max(pct,0), 100);
  const color    = migrationColor(pct);
  return `
    <div class="migration-cell">
      <div class="migration-bar"><div class="migration-fill" style="width:${fill}%;background:${color}"></div></div>
      <span class="migration-pct" style="color:${color}">${display}%</span>
    </div>`;
}

// ===== Resumo Operacional (topo do painel individual) =====
function renderResumoIndividual(esp){

// ===== Persistência local (matinais) =====
const STORE_KEY = 'gestao_xpert_estoque_v1';
function loadStore(){ try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch(e){ return {}; } }
function saveStore(s){ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }
let STORE = loadStore();
function getState(id){ return STORE[id] || { ativar:null, data:null }; }
function setState(id, patch){
  STORE[id] = Object.assign({ ativar:null, data:null }, STORE[id]||{}, patch);
  saveStore(STORE);
}
function resetEstoque(email){
  const ids = DATA.especialistas.find(e=>e.email===email).estoque.map(x=>x.id);
  ids.forEach(id => { delete STORE[id]; });
  saveStore(STORE);
}

// ===== Persistência dos motivos de churn =====
const CHURN_KEY = 'gestao_xpert_churn_motivo_v1';
let CHURN_MOT = {};
try { CHURN_MOT = JSON.parse(localStorage.getItem(CHURN_KEY) || '{}'); } catch(e){ CHURN_MOT = {}; }
// Migração: formato antigo era string solto (motivo). Converte para objeto.
Object.keys(CHURN_MOT).forEach(id => {
  if (typeof CHURN_MOT[id] === 'string') {
    CHURN_MOT[id] = { motivo: CHURN_MOT[id], voltar: null, data: null };
  }
});
function saveChurn(){ localStorage.setItem(CHURN_KEY, JSON.stringify(CHURN_MOT)); }
function getChurnState(id){
  const v = CHURN_MOT[id];
  return v ? { motivo: v.motivo||'', voltar: v.voltar||null, data: v.data||null }
           : { motivo: '', voltar: null, data: null };
}
function setChurnState(id, patch){
  const next = Object.assign(getChurnState(id), patch);
  if (next.motivo || next.voltar || next.data) {
    CHURN_MOT[id] = next;
  } else {
    delete CHURN_MOT[id];
  }
  saveChurn();
}

// ===== Estado de colapso das seções da Operação =====
const COLLAPSE_KEY = 'gestao_xpert_op_collapsed_v1';
let COLLAPSED = {};
try { COLLAPSED = JSON.parse(localStorage.getItem(COLLAPSE_KEY) || '{}'); } catch(e){ COLLAPSED = {}; }
function saveCollapsed(){ localStorage.setItem(COLLAPSE_KEY, JSON.stringify(COLLAPSED)); }
function collapsedAttr(id){ return COLLAPSED[id] ? ' data-collapsed="true"' : ''; }

const groups = [];
let cur = null;
DATA.especialistas.forEach(esp => {

groups.forEach(g => {

});

          <div class="kpi featured">
            <div class="kpi-label">Estoque · Time</div>
            <div class="kpi-value">${String(tot.total_efetivo).padStart(2,'0')}</div>
            <div class="kpi-foot">credenciados sem ativação</div>
          </div>
          <div class="kpi compact outline">
            <div class="kpi-label">TPV Precificado · Time</div>
            <div class="kpi-value">${fmtBRL.format(tot.tpv_efetivo)}</div>
            <div class="kpi-foot">somatório do estoque</div>
          </div>
        </div>
        ${tabela}
      </div>`;
  }
};

// Registry de indicadores — ordem importa, é a ordem de exibição
const INDICATORS = [IND_NovosClientes, IND_AtivosM0, IND_Estoque, IND_TpvAtivosM1, IND_CarteiraHunter, IND_Churn];

// ===== Render do painel da Operação =====
function renderOperacao(){
  // Totais efetivos (deduzindo Não) — usados nas stats do cabeçalho
  let est_efetivo = 0, tpv_est_efetivo = 0;
  DATA.especialistas.forEach(esp => {
    const e = IND_Estoque.computeEffective(esp);
    est_efetivo += e.total_efetivo;
    tpv_est_efetivo += e.tpv_efetivo;
  });

  const html = INDICATORS.map(ind => ind.renderOperacao()).join('');
  opPanel.innerHTML = `
    <div class="op-head">
      <div style="display:flex;align-items:center;gap:18px">
        <div class="op-mark">XPERT</div>
        <div>
          <h2>Resultado da Operação</h2>
          <div class="op-meta">Distrito Rio Litoral · 12 especialistas · ${DATA.atualizado}</div>
        </div>
      </div>
      <div class="op-stats">
        <div class="op-stat">
          <div class="l">Novos · Maio</div>
          <div class="v">${DATA.total_time_maio}</div>
        </div>
        <div class="op-stat">
          <div class="l">Ativos M0</div>
          <div class="v">${DATA.total_time_ativos_m0}</div>
        </div>
        <div class="op-stat">
          <div class="l">Estoque</div>
          <div class="v">${est_efetivo}</div>
        </div>
        <div class="op-stat">
          <div class="l">Projeção M0 · M1</div>
          <div class="v">${fmtBRL.format(DATA.total_time_tpv_m0_proj_m1)}</div>
        </div>

}

renderOperacao();

function classDias(d){
  if (d <= 30) return 'ok';
  if (d <= 60) return 'warn';
  return 'alert';
}

// Delegação de eventos para Sim/Não, data, reset
document.addEventListener('click', (e) => {
  // ===== Copiar Stone Code =====
  const chip = e.target.closest('.stone-code');
  if (chip) {
    const code = chip.dataset.code;

    // Fallback usando textarea + execCommand (funciona em iframes restritos)
    const copyViaExec = () => {
      const ta = document.createElement('textarea');
      ta.value = code;
      ta.setAttribute('readonly','');
      ta.style.position='fixed';
      ta.style.top='0';
      ta.style.left='0';
      ta.style.opacity='0';
      ta.style.pointerEvents='none';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, code.length);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
      return ok;
    };

    const showCopied = () => {
      chip.classList.add('copied');
      setTimeout(() => chip.classList.remove('copied'), 1200);
    };

    (async () => {
      // Tenta API moderna
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(code);
          showCopied();
          return;
        }
      } catch (_) { /* cai no fallback */ }
      // Fallback execCommand
      if (copyViaExec()) { showCopied(); return; }
      // Último recurso: deixa o texto selecionado pro usuário dar Ctrl+C
      const range = document.createRange();
      range.selectNodeContents(chip.firstChild);
      const sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(range);
      chip.title = 'Selecionado — Ctrl+C para copiar';
    })();
    return;
  }

  const btn = e.target.closest('.yesno button');
  if (btn) {
    const wrap = btn.closest('.yesno');
    const id = wrap.dataset.id;
    const val = btn.dataset.val;
    const sec = btn.closest('[data-section]');
    const sectionKind = sec?.dataset.section;

    // ===== Sim/Não dentro do CHURN =====
    if (sectionKind === 'churn') {
      const cur = getChurnState(id).voltar;
      const newVal = (cur === val) ? null : val;
      setChurnState(id, { voltar: newVal, data: newVal==='sim' ? getChurnState(id).data : null });

      wrap.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.val === newVal));
      const tr = btn.closest('tr');
      tr.classList.remove('row-sim','row-nao');
      if (newVal === 'sim') tr.classList.add('row-sim');
      if (newVal === 'nao') tr.classList.add('row-nao');
      const dateInput = tr.querySelector('.date-input');
      if (newVal === 'sim') { dateInput.disabled = false; }
      else { dateInput.disabled = true; dateInput.value = ''; }
      renderOperacao();
      return;
    }

    // ===== Sim/Não dentro do ESTOQUE (comportamento original) =====
    const curEst = getState(id).ativar;
    const newVal = (curEst === val) ? null : val;
    setState(id, { ativar: newVal, data: newVal==='sim' ? getState(id).data : null });

    wrap.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.val === newVal));
    const tr = btn.closest('tr');
    tr.classList.remove('row-sim','row-nao');
    if (newVal === 'sim') tr.classList.add('row-sim');
    if (newVal === 'nao') tr.classList.add('row-nao');
    const dateInput = tr.querySelector('.date-input');
    if (newVal === 'sim') { dateInput.disabled = false; }
    else { dateInput.disabled = true; dateInput.value = ''; }

    refreshProgress(btn.closest('.section').dataset.email);
    refreshEstoqueKPIsIndividual(btn.closest('.section').dataset.email);
    renderOperacao();
    return;
  }
  const reset = e.target.closest('.reset-link');
  if (reset) {
    if (confirm('Limpar todas as respostas deste especialista?')) {
      const email = reset.dataset.reset;
      resetEstoque(email);
      const esp = DATA.especialistas.find(e=>e.email===email);
      const sec = document.querySelector(`.panel[data-email="${email}"] [data-section="estoque"]`);
      if (sec) {
        const wrap = document.createElement('div');
        wrap.innerHTML = IND_Estoque.renderIndividual(esp);
        sec.replaceWith(wrap.firstElementChild);
      }
      renderOperacao();                                         // ⇦ idem
    }
    return;
  }
  // Colapsar / expandir uma seção da Operação
  const collapseBtnEl = e.target.closest('.collapse-btn');
  if (collapseBtnEl) {
    const id = collapseBtnEl.dataset.collapse;
    COLLAPSED[id] = !COLLAPSED[id];
    saveCollapsed();
    const sec = collapseBtnEl.closest('.section');
    if (sec) sec.dataset.collapsed = COLLAPSED[id] ? 'true' : 'false';
    return;
  }
});

document.addEventListener('change', (e) => {
  if (e.target.classList.contains('date-input')) {
    const id = e.target.dataset.id;
    const sec = e.target.closest('[data-section]');
    if (sec?.dataset.section === 'churn') {
      setChurnState(id, { data: e.target.value || null });
    } else {
      setState(id, { data: e.target.value || null });
    }
    return;
  }
  if (e.target.classList.contains('motivo-select')) {
    const id  = e.target.dataset.churnId;
    const val = e.target.value;
    setChurnState(id, { motivo: val });
    e.target.classList.toggle('filled', !!val);
    refreshChurnProgress();
    renderOperacao();
  }
});

function refreshProgress(email){
  const esp = DATA.especialistas.find(e=>e.email===email);
  if (!esp) return;
  const respondidos = esp.estoque.filter(c => (STORE[c.id]||{}).ativar).length;
  const chip = document.querySelector(`.panel[data-email="${email}"] .progress-chip`);
  if (chip) chip.innerHTML = `<span class="dot"></span>${respondidos}/${esp.estoque_total} preenchidos`;
}

function refreshChurnProgress(){
  DATA.especialistas.forEach(esp => {
    const respondidos = esp.churn.filter(c => CHURN_MOT[c.id]?.motivo).length;
    const chip = document.querySelector(`.panel[data-email="${esp.email}"] [data-section="churn"] .progress-chip`);
    if (chip) chip.innerHTML = `<span class="dot"></span>${respondidos}/${esp.churn.length} com motivo`;
  });
}

function refreshEstoqueKPIsIndividual(email){
  const esp = DATA.especialistas.find(e=>e.email===email);
  if (!esp) return;
  const grid = document.querySelector(`[data-est-kpis="${email}"]`);
  if (grid) {
    // Substitui o grid inteiro por uma versão fresca
    const wrap = document.createElement('div');
    wrap.innerHTML = IND_Estoque._kpiHTML(esp);
    grid.replaceWith(wrap.firstElementChild);
  }
}

function setActive(email){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.email === email));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.dataset.email === email));
}

// Inicia na aba Operação
setActive(OP_ID);

})(); // fim do bootstrap
</script>
